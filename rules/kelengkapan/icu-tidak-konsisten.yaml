    identitas: true

bukti_yang_perlu_diperiksa:
  - Periksa di rekam medis apakah pasien benar dirawat di unit perawatan intensif, berapa lama, dan apakah memakai ventilator.
  - Periksa catatan ruangan untuk memastikan jenis rawat pada klaim sesuai dengan tempat pasien dirawat.
  - Periksa pada rincian tagihan rumah sakit di komponen mana biaya perawatan intensif dibukukan.
  - Periksa isian indikator ICU, lama rawat ICU, dan jam ventilator pada aplikasi E-Klaim terhadap catatan perawatan.

catatan_etika: >-
  Temuan ini soal kecocokan antar-isian, bukan soal besaran klaim. Memindahkan
  biaya antar komponen atau mengubah indikator ICU supaya isiannya cocok satu
  sama lain adalah hal yang TIDAK boleh dilakukan atas dasar temuan ini. Yang
  benar adalah menyesuaikan catatan dengan pelayanan yang sungguh-sungguh
  diberikan, termasuk bila hasilnya menurunkan nilai klaim.
